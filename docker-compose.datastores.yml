# 数据层编排：PostgreSQL(+pgvector) + Redis
#
# 只起数据库和缓存，不构建 app 镜像，用于本地开发 / 单独调试数据层。
# 与 docker-compose.yml 里的 db / redis 服务互斥（同占 5432、6379），二选一启动。
#
# 启动：docker compose -f docker-compose.datastores.yml up -d
# 状态：docker compose -f docker-compose.datastores.yml ps
# 停止：docker compose -f docker-compose.datastores.yml down
# 清库：docker compose -f docker-compose.datastores.yml down -v   # 连同数据卷一起删，慎用
#
# 变量默认值对齐 .env.example；想用 .env.development 覆盖就加 --env-file .env.development

name: fly-agent-datastores

services:
  db:
    # PostgreSQL 16 + pgvector 0.8.7，扩展已编译进镜像
    # 备选：pgvector/pgvector:pg17 或 0.8.7-pg18（换主版本必须重建数据卷，不能直接复用旧卷）
    image: pgvector/pgvector:pg16
    container_name: fly-agent-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      # 开页校验，能及早发现磁盘层面的静默损坏；只在初始化时生效
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # 中文排序/大小写比较若需要，再打开下面这行（建库时生效）
      # POSTGRES_INITDB_ARGS: "--data-checksums --locale=C.UTF-8 --encoding=UTF8"
    ports:
      # 只绑本机，不暴露到局域网；需要外部访问再改成 "5432:5432"
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fly-pg-data:/var/lib/postgresql/data
      # 首次初始化时执行，用来 CREATE EXTENSION vector
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    # HNSW 并行建索引会吃 shared memory，低于 maintenance_work_mem 会直接报错
    shm_size: 1gb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydb}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    # Redis 8.x 已把 RediSearch / JSON / Bloom / TimeSeries 收进主镜像，
    # 不再需要 redis/redis-stack-server（该镜像已废弃）
    image: redis:8.0.6-alpine
    container_name: fly-agent-redis
    # appendonly yes：AOF 持久化，重启不丢缓存写入
    # noeviction：内存满了报错而不是静默淘汰（缓存盘可按需改 allkeys-lru）
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction" ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - fly-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  fly-pg-data:
  fly-redis-data:
