apiVersion: 1

# 数据源同样走「配置即代码」：Grafana 启动时按本文件创建 Prometheus 数据源。
#
# 少了这个文件会怎样：看板能导入，但面板里的 datasource 引用找不到对象，
# 打开就是 "Datasource prometheus was not found"，六块图全是空的——
# 现象很像「指标没上报」，实际只是数据源没配。排查时先看这一步。
datasources:
  - name: Prometheus
    # 看板里统一用这个 uid 引用，将来改显示名不会影响已保存的看板
    uid: prometheus
    type: prometheus
    access: proxy
    # 容器内走服务名，不是 localhost——localhost 指向 grafana 容器自己
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # 与 prometheus/prometheus.yml 的 scrape_interval 对齐，
      # 让 Grafana 的 rate 窗口自动按 15s 粒度取点
      timeInterval: 15s
      httpMethod: POST
