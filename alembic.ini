# =============================================================================
# Alembic configuration (database migrations).
# =============================================================================
# Common commands (wrapped by the Makefile, which also loads the right .env):
#   make migrate                       upgrade to the latest revision
#   make migration MSG="what changed"  autogenerate a revision from the models
#   make migrate-downgrade             roll back one revision
#   make migrate-history               list revisions
#
# Two things worth knowing up front:
#   1. sqlalchemy.url below is intentionally EMPTY. The connection URL is built
#      at runtime by alembic/env.py from app/core/config.py Settings, so there is
#      exactly one source of truth. Set SQLALCHEMY_URL to override it ad hoc.
#   2. KEEP THIS FILE ASCII-ONLY. Alembic reads it with the OS locale encoding
#      (alembic/util/compat.py: read(..., encoding="locale")), which is GBK on a
#      Chinese Windows install. Non-ASCII characters here raise UnicodeDecodeError
#      before any command runs. The Chinese walkthrough lives in docs/database.md.
#
# This file is ConfigParser format: inline comments are NOT stripped (they become
# part of the value), so comments must occupy their own line.
# =============================================================================


[alembic]
# Directory holding the migration scripts. %(here)s expands to the directory of
# this ini file, so running alembic from another cwd still resolves correctly.
script_location = %(here)s/alembic

# Template for revision filenames. Default is %%(rev)s_%%(slug)s, which yields
# names like b25d38b0cd7c_initial_schema.py. Uncomment to prepend a timestamp
# (nicer for reading order). Percent signs are doubled because ConfigParser
# treats % as an interpolation token.
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# Date-based subdirectories also work (requires recursive_version_locations = true):
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# Prepended to sys.path, so `from app.core.config import settings` inside env.py
# resolves to this project instead of whatever is installed in site-packages.
prepend_sys_path = .


# Timezone used for the date rendered into revision filenames and headers.
# Requires the tzdata package (pip install "alembic[tz]"). Blank = local time.
# timezone =

# Max characters kept in the "slug" part of a revision filename.
# truncate_slug_length = 40

# Set to true to run env.py on every `alembic revision`, not only on autogenerate.
# Default false is faster.
# revision_environment = false

# Set to true to treat .pyc/.pyo files without a matching .py source in
# versions/ as revisions.
# sourceless = false

# Version script directories. Defaults to <script_location>/versions. Only needed
# when maintaining several migration branches; the first revision in each extra
# directory must be created with --version-path.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator: how the path lists above are split. "os" means os.pathsep
# (":" on Linux/macOS, ";" on Windows), which is why it is the portable choice.
# For backwards compatibility this default is NOT applied when the option is
# missing entirely; the legacy fallbacks are "split version_locations on spaces
# or commas" and "split prepend_sys_path on spaces, commas or colons".
# Accepted values: ":" / ";" / space / newline / os
path_separator = os

# Set to true to search each version_locations directory recursively
# (Alembic 1.10+).
# recursive_version_locations = false

# Encoding used when writing revision files from script.py.mako.
# output_encoding = utf-8

# Database URL. Per the Alembic docs this is consumed only by the user-maintained
# env.py, which is exactly the case here: env.py builds it from Settings (and
# honours the SQLALCHEMY_URL environment variable). Never hard-code a URL here,
# or it will fight with the .env files.
sqlalchemy.url =


# -----------------------------------------------------------------------------
# Hooks that run right after a revision file is written.
# -----------------------------------------------------------------------------
# Autogenerated scripts are rarely formatted correctly, so run ruff over the new
# file (fix + format) before it can be committed. REVISION_SCRIPT_FILENAME is an
# Alembic-provided placeholder replaced with the generated file path.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# -----------------------------------------------------------------------------
# Logging (also consumed only by env.py).
# -----------------------------------------------------------------------------
# Kept quiet on purpose: migration output should stay readable, so only Alembic's
# own INFO progress and warnings are shown. Raise sqlalchemy to INFO when you
# need to see every emitted statement.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# Root logger: WARNING and above only, so third-party libraries stay silent.
[logger_root]
level = WARNING
handlers = console
qualname =

# SQLAlchemy engine logger: set to INFO to print each executed statement.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# Alembic itself: INFO reports which revision is being applied.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Write to stderr so stdout stays clean for anything the user pipes.
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Format: level (left-aligned, 5 chars), logger name, message; time as HH:MM:SS.
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
