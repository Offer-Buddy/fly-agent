# =============================================================================
# 全栈编排：API + PostgreSQL(pgvector) + Redis
# =============================================================================
# 常用命令（都通过 Makefile 包装，会顺带校验 ENV 与 .env 文件）：
#   make docker-up      # 起 db + redis + app
#   make docker-down    # 停全部服务
#   make docker-logs    # 跟日志
#
# 监控栈（Prometheus / Grafana / cadvisor）已移除；LLM 链路追踪由外部独立部署的
# Langfuse 承担，本项目只读 .env 里的 LANGFUSE_HOST 与 key，不负责它的起停。
#
# 直接调 compose 时要自己带环境文件，否则 ${POSTGRES_USER} 之类会解析成空：
#   APP_ENV=development docker-compose --env-file .env.development up -d
#
# 只想单独起数据层、不构建 app 镜像，用 `up -d db redis` 指定服务名：
#   APP_ENV=development docker-compose --env-file .env.development up -d db redis
# =============================================================================

# 项目名显式固定，不随目录名变化：网络名与容器名前缀都依赖它。
name: fly-agent

# 这行是 Compose V1 时代的格式声明，Compose V2 已忽略；保留只为兼容老命令。
version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector
  # ---------------------------------------------------------------------------
  # 用 pgvector 官方镜像而不是官方 postgres 再自己装扩展：
  # 扩展已编译进镜像，省掉构建步骤，也避免版本对不上。
  # 长期记忆（mem0 + pgvector）与 LangGraph checkpointer 都落在这个库里。
  db:
    image: pgvector/pgvector:pg16
    # 固定 amd64：该镜像的 arm64 变体不全，Apple Silicon 上靠 Rosetta/QEMU 跑更稳。
    # 纯 x86 服务器上这行可以删掉。
    platform: linux/amd64
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      # 对宿主机开放，方便用 DBeaver / psql 直接连；只在内网用可改成
      # "127.0.0.1:5432:5432" 收紧到本机
      - "5432:5432"
    volumes:
      # 命名卷持久化数据。注意：换大版本（如 pg16 → pg17）不能直接复用旧卷，
      # 必须 pg_dump 导出再导入
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 只探「能否接受连接」，比 TCP 端口探测更能反映真实可用性
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # Redis —— 可选组件
  # ---------------------------------------------------------------------------
  # 用途有两个：① 缓存层（app/core/cache.py）② 限流的共享存储（多副本时必须）。
  # 不启用就直接把 .env 里的 REDIS_HOST 注释掉，缓存与限流会自动退化为
  # 进程内实现（单副本够用，多副本会各算各的）。
  redis:
    image: redis:8.0.6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # 应用本体（FastAPI + LangGraph）
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      args:
        # 传给 Dockerfile 的 ARG APP_ENV，决定镜像内的默认环境标识
        APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    volumes:
      # 挂源码目录，改代码后容器内立即可见（配合 --reload 才自动重启；
      # 生产部署请删掉这两行，用镜像里的代码，避免宿主机文件影响运行时）
      - ./app:/app/app
      # 日志落到宿主机 ./logs，方便直接看 JSONL 文件，不用进容器
      - ./logs:/app/logs
    env_file:
      # 按 APP_ENV 挑环境文件；文件不存在时 compose 会直接报错退出
      - .env.${APP_ENV:-development}
    environment:
      # environment 段的优先级高于 env_file，这里放三类「必须覆盖」的变量
      - APP_ENV=${APP_ENV:-development}
      # `:?` 表示变量为空时立刻报错退出，防止用空密钥把服务跑起来
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?必须为 JWT_SECRET_KEY 设置一个足够随机的长字符串}
      # .env 文件里写的是 localhost（本机直跑时正确），但在容器里 localhost
      # 指向容器自己，连不到数据库。这里改指 compose 的服务名，由内置 DNS 解析。
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      # 用 1 号库，避开其他服务可能占用的 0 号库，防止 key 互相覆盖
      # （compose 起的 redis 是共享实例，不是这个项目独占的）
      - REDIS_DB=1
      # Langfuse 由外部独立部署（不在本编排里）。容器内的 localhost 指 app 自己，
      # 所以默认改走 host.docker.internal 打到宿主机上的实例；端口按你的部署改。
      #   宿主机 published 端口         → 保持默认 http://host.docker.internal:3010
      #   app 与 Langfuse 同网络        → 设 LANGFUSE_HOST_INTERNAL=http://langfuse-web:3000
      #   Langfuse 在别的机器           → 设 LANGFUSE_HOST_INTERNAL=http://<ip>:3000
      - LANGFUSE_HOST=${LANGFUSE_HOST_INTERNAL:-http://host.docker.internal:3010}
    # Linux 宿主不会自带 host.docker.internal 解析；Docker Desktop（Win/Mac）自带，
    # 这行在那边是无害的重复声明。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        # 等到健康检查通过再启动，否则应用会在启动瞬间连不上库而崩溃重启
        condition: service_healthy
    healthcheck:
      # 探 HTTP 层的 /health，能同时验证「进程活着」和「依赖可用」
      # （/health 内部会检查数据库连通性）。
      # 注意：镜像里必须有 curl；若基础镜像没装 curl，这里会一直判为
      # unhealthy，可改成用 python 的 socket 探测替代。
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 应用启动要初始化数据库、加载模型注册表、编译图，给 10 秒宽限
      start_period: 10s
    restart: on-failure
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # 监控与可视化
  # ---------------------------------------------------------------------------
  # 原 Prometheus + Grafana + cadvisor 三件套已移除：
  #   LLM 侧观测由外部部署的 Langfuse 负责（只配 .env，不在本编排内），
  #   请求侧观测由 structlog 的 http_request_completed 日志负责。
  #   要接回指标栈时，再加服务并让 app 暴露 /metrics 即可。


# 所有服务放在同一个自定义 bridge 网络里：
# 好处是服务名即主机名（app、db、redis 可直接互相访问），
# 且与宿主机上其他 compose 项目的网络隔离，不会串台。
#
# 网络名显式固定为 fly-agent-net：不随目录改名漂移。
# 若外部 Langfuse 也跑在 compose 里、想用服务名直连，把它 join 到本网络，
# 再把 LANGFUSE_HOST_INTERNAL 指过去即可；默认不依赖它。
networks:
  app-net:
    name: fly-agent-net
    driver: bridge

# 命名卷：由 Docker 管理，`docker compose down` 不会删（要删得加 -v）
volumes:
  postgres-data:
  redis-data:
