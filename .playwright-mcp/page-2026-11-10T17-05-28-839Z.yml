    - heading "四、鉴权：验一次，两条通道都认" [level=2] [ref=f1e145]
    - paragraph [ref=f1e146]: 思路很朴素：发一张票（JWT），两条通道都认这张票。网关验一次，把"你是谁"写进请求，后面的路由和工具直接拿来用。
    - generic [ref=f1e147]: ▤ app/security.py（发牌与验牌）
    - generic [ref=f1e148]: "def issue_token(username: str) -> str: payload = {\"sub\": username, \"exp\": datetime.now(UTC) + timedelta(minutes=30)} return jwt.encode(payload, SECRET_KEY, algorithm=ALGORITHM) def user_of(token: str) -> str | None: \"\"\"验签并取出用户名，验不过返回 None。\"\"\" try: payload = jwt.decode(token, SECRET_KEY, algorithms=[ALGORITHM]) except jwt.PyJWTError: return None return payload.get(\"sub\")"
    - paragraph [ref=f1e149]:
      - text: 网关做两件事：验票、把身份塞进
      - code [ref=f1e150]: scope
      - text: 。后面不管走到 REST 还是 MCP，都能直接取到。
    - generic [ref=f1e151]: ▤ app/security.py（网关里的鉴权部分）
    - generic [ref=f1e152]: "async def __call__(self, scope, receive, send): if scope[\"type\"] != \"http\" or scope[\"path\"] in PUBLIC_PATHS: return await self.app(scope, receive, send) # 探活、登录、文档放行 username = user_of(bearer_of(scope)) if username is None: return await self._deny(send, 401, \"invalid_token\", \"缺少或无效的 Bearer token\") scope.setdefault(\"state\", {})[\"username\"] = username # 身份留给后面用 await self.app(scope, receive, send)"
