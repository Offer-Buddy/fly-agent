    - generic [ref=f1e167]: fastmcp-demo/ ├─ app/ │ ├─ service.py 业务：建任务 / 列任务 / 完成任务（纯 Python） │ ├─ tools.py MCP：把 service 包成工具 │ ├─ security.py 网关：鉴权 + 限流 │ └─ main.py 外壳：路由 + 挂载 + 装网关 ├─ client_check.py 以 AI 客户端身份验收 └─ requirements.txt
    - generic [ref=f1e168]: ▤ app/service.py
    - generic [ref=f1e169]: "from itertools import count _TASKS: dict[int, dict] = {} _SEQ = count(1) def create_task(title: str, owner: str) -> dict: task_id = next(_SEQ) task = {\"id\": task_id, \"title\": title, \"owner\": owner, \"done\": False} _TASKS[task_id] = task return task def list_tasks(owner: str) -> list[dict]: return [t for t in _TASKS.values() if t[\"owner\"] == owner]"
    - paragraph [ref=f1e170]:
      - text: 注意每个函数都带
      - code [ref=f1e171]: owner
      - text: 。鉴权不是为了拦人，是为了知道是谁 —— 这条一旦落到参数上，两条通道的数据隔离就自动成立了，不用在两处各写一遍过滤。
    - generic [ref=f1e172]: ▤ app/tools.py
    - generic [ref=f1e173]: "from fastmcp import FastMCP from fastmcp.server.dependencies import get_http_headers from app import service from app.security import API_KEYS mcp = FastMCP(\"task-tools\") def caller() -> str: # 工具跑在 HTTP 请求里时，能直接读到调用方的请求头 return API_KEYS.get(get_http_headers().get(\"x-api-key\", \"\"), \"anonymous\") @mcp.tool def create_task(title: str) -> dict: \"\"\"新建一个任务。\"\"\" return service.create_task(title, caller())"
    - paragraph [ref=f1e174]:
      - code [ref=f1e175]: get_http_headers()
      - text: 是关键：AI 那边不知道自己是谁，但请求头带着网关验过的 key，工具这边就能还原出同一个人。鉴权只做一次，身份穿透到工具里。
    - generic [ref=f1e176]: ▤ app/main.py
    - generic [ref=f1e177]: "from fastapi import FastAPI, Request from app import service from app.security import Gateway from app.tools import mcp mcp_app = mcp.http_app(path=\"/\") # ① 变成 ASGI 应用 app = FastAPI(lifespan=mcp_app.lifespan) # ② 交托生命周期 app.add_middleware(Gateway) # ③ 网关在最外层 app.mount(\"/mcp\", mcp_app) # ④ 端点 = /mcp/ @app.get(\"/api/tasks\") async def list_tasks(request: Request) -> dict: return {\"user\": request.state.user, \"items\": service.list_tasks(request.state.user)}"
    - paragraph [ref=f1e178]:
      - text: 四行就是全部集成工作。
      - code [ref=f1e179]: request.state.user
      - text: 不用自己赋值 —— 网关放行时已经写进
