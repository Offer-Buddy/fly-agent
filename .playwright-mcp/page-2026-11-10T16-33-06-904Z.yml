    - heading "五、网关：鉴权和限流放在一起，一次管两条通道" [level=2] [ref=f1e181]
    - paragraph [ref=f1e182]:
      - text: 为什么不给路由加装饰器？因为
      - code [ref=f1e183]: "@limiter.limit(\"6/minute\")"
      - text: 这类写法只能挂在 FastAPI 的路由函数上，挂不到 mount 进来的 MCP 子应用。要么两套代码，要么下沉一层、在 ASGI 上做一次。
    - generic [ref=f1e184]: ▤ app/security.py
    - generic [ref=f1e185]: "class Gateway: \"\"\"鉴权 -> 限流 -> 放行。顺序不能反。\"\"\" def __init__(self, app): self.app = app async def __call__(self, scope, receive, send): if scope[\"type\"] != \"http\" or scope[\"path\"] in PUBLIC_PATHS: return await self.app(scope, receive, send) user = API_KEYS.get(Headers(scope=scope).get(\"x-api-key\", \"\")) if user is None: return await self._deny(send, 401, \"invalid_api_key\", \"缺少或错误的 x-api-key\") channel = \"/mcp\" if scope[\"path\"].startswith(\"/mcp\") else \"/api\" wait = _take_token(f\"{user}{channel}\", QUOTA[channel], time.monotonic()) if wait > 0: return await self._deny(send, 429, \"rate_limited\", \"请求太频繁\", wait) scope.setdefault(\"state\", {})[\"user\"] = user await self.app(scope, receive, send)"
