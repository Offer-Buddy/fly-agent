      - generic [ref=f1e305]: "# 角色 你是 Python 后端工程师。只做集成，不重构既有业务逻辑。 # 现状 路由函数里直接写了业务和 SQL，例如： @app.get(\"/api/orders\") async def list_orders(user=Depends(current_user)): return await db.fetch_all(\"select * from orders where uid=:u\", {\"u\": user.id}) # 要做的三件事 1. 把这段逻辑原样抽成 `service.list_orders(uid)`，行为不变 2. 新建 `tools.py`，用 FastMCP 包一层，只暴露查询类能力 3. 在 `main.py` 里 mount 到 `/mcp`，并接上现有鉴权 # 输出格式 - 每个改动文件给完整内容，不要 diff 片段 - 结尾列出：新端点的完整路径（含末尾斜杠） # 硬约束 - 不许改任何现有 REST 端点的路径与返回结构 - service 层不许 import fastapi / fastmcp - 不许把写操作（下单、退款）暴露成工具 # 自检（输出前逐条回答） - 抽出 service 后，原来那条 curl 还能拿到一模一样的结果吗？ - 漏了 lifespan 会怎样，代码里补了吗？ - AI 通过工具能看到别人的数据吗？"
