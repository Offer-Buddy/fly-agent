    - heading "一、开场：第二套后端是怎么长出来的" [level=2] [ref=f1e104]
    - paragraph [ref=f1e105]: 第一步都长这样：先给前端写一套 REST，跑得好好的。
    - generic [ref=f1e106]: "@app.post(\"/api/tasks\") async def create_task(payload: TaskIn, request: Request): return service.create_task(payload.title, request.state.user)"
    - paragraph [ref=f1e107]: 第二步，要让 AI 客户端也能建任务。于是新建一个文件，把同一件事再写一遍 —— 只是换了个装饰器：
    - generic [ref=f1e108]: "@mcp.tool def create_task(title: str) -> dict: return service.create_task(title, \"alice\") # 身份？先写死吧"
    - paragraph [ref=f1e109]: 现在问三个问题：标题长度校验改在哪一处？限流对 MCP 那套生效了吗？AI 建的任务，前端能看见吗？——三个都答不上来，因为已经有了两份真相。
    - generic [ref=f1e110]:
      - generic [ref=f1e111]: 这一课要解决的事
      - text: 不是 MCP 难，是它被当成了第二个后端。它本该是同一个后端上多开的一扇门。
    - heading "二、本质：FastMCP 交出来的就是一个 ASGI 应用" [level=2] [ref=f1e112]
    - paragraph [ref=f1e113]:
      - code [ref=f1e114]: mcp.http_app()
      - text: 返回的不是"另一个框架"，它和 FastAPI 一样是个 ASGI app —— 所以
      - code [ref=f1e115]: app.mount()
      - text: 能直接把它挂进来，共用一个进程、一份内存、一个端口。
    - generic [ref=f1e116]:
      - generic [ref=f1e117]: 三种接法，选一个
      - generic [ref=f1e118]:
        - generic [ref=f1e119]: 起两个进程
        - generic [ref=f1e120]: REST 一个、MCP 一个。状态不共享，鉴权写两遍，部署多一份 —— 就是开场那个坑的放大版。
      - generic [ref=f1e121]:
        - generic [ref=f1e122]: 自动转换
        - generic [ref=f1e123]:
          - code [ref=f1e124]: FastMCP.from_fastapi(app)
          - text: 能把全部路由一次变成工具。适合原型，但整个 API 都暴露给 AI，工具粒度和描述都控制不住。
      - generic [ref=f1e125]:
        - generic [ref=f1e126]: 挂载子应用
        - generic [ref=f1e127]: 只把该给 AI 的能力写成工具，其余不暴露。一个进程、一层网关、一份业务 —— 这里走这条。
    - paragraph [ref=f1e128]: 挂载之后，请求在进程里的真实形状是这样，中间件在 router 外面这句话决定了后面所有事：
    - generic [ref=f1e129]: FastAPI app ├─ Gateway 中间件：先过这里（鉴权 → 限流） └─ router ├─ /api/* ├→ 普通路由函数 └─ /mcp └→ MCP 子应用（路由到这儿时，网关已经放行过了）
    - paragraph [ref=f1e130]: 所以 mount 进来的东西天然被网关罩住 —— 前提是网关加在 app 上，而不是加在某个路由上。
