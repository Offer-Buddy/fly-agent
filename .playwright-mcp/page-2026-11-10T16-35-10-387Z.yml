    - heading "为什么 MCP 的额度必须比 REST 宽" [level=3] [ref=f3e204]
    - paragraph [ref=f3e205]:
      - text: 这是最容易翻车的一处：一次工具调用 ≠ 一个 HTTP 请求。客户端握手要
      - code [ref=f3e206]: initialize
      - text: 、
      - code [ref=f3e207]: notifications/initialized
      - text: 、
      - code [ref=f3e208]: tools/list
      - text: ，然后才是
      - code [ref=f3e209]: tools/call
      - text: ，一次会话眨眼就 5 帧以上。
    - generic [ref=f3e210]: "QUOTA = {\"/api\": 6, \"/mcp\": 60} # 实测：两条都设 6，MCP 第三次工具调用就 429"
    - generic [ref=f3e211]:
