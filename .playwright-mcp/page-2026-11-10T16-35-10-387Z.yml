    - heading "四、搭骨架：先把业务摘出来" [level=2] [ref=f3e172]
    - paragraph [ref=f3e173]:
      - text: 整个 demo 五个文件，每个只干一件事。
      - generic [ref=f3e174]:
        - text: 判断骨架对不对，看
        - code [ref=f3e175]: service.py
        - text: 顶部有没有 import 框架。
    - generic [ref=f3e176]: fastmcp-demo/ ├─ app/ │ ├─ service.py 业务：建任务 / 列任务 / 完成任务（纯 Python） │ ├─ tools.py MCP：把 service 包成工具 │ ├─ security.py 网关：鉴权 + 限流 │ └─ main.py 外壳：路由 + 挂载 + 装网关 ├─ client_check.py 以 AI 客户端身份验收 └─ requirements.txt
    - generic [ref=f3e177]: ▤ app/service.py
    - generic [ref=f3e178]: "from itertools import count _TASKS: dict[int, dict] = {} _SEQ = count(1) def create_task(title: str, owner: str) -> dict: task_id = next(_SEQ) task = {\"id\": task_id, \"title\": title, \"owner\": owner, \"done\": False} _TASKS[task_id] = task return task def list_tasks(owner: str) -> list[dict]: return [t for t in _TASKS.values() if t[\"owner\"] == owner]"
    - paragraph [ref=f3e179]:
      - text: 注意每个函数都带
      - code [ref=f3e180]: owner
      - text: 。鉴权不是为了拦人，是为了知道是谁 —— 这条一旦落到参数上，两条通道的数据隔离就自动成立了，不用在两处各写一遍过滤。
    - generic [ref=f3e181]: ▤ app/tools.py
    - generic [ref=f3e182]: "from fastmcp import FastMCP from fastmcp.server.dependencies import get_http_headers from app import service from app.security import API_KEYS mcp = FastMCP(\"task-tools\") def caller() -> str: # 工具跑在 HTTP 请求里时，能直接读到调用方的请求头 return API_KEYS.get(get_http_headers().get(\"x-api-key\", \"\"), \"anonymous\") @mcp.tool def create_task(title: str) -> dict: \"\"\"新建一个任务。\"\"\" return service.create_task(title, caller())"
    - paragraph [ref=f3e183]:
      - code [ref=f3e184]: get_http_headers()
      - text: 是关键：AI 那边不知道自己是谁，但请求头带着网关验过的 key，工具这边就能还原出同一个人。鉴权只做一次，身份穿透到工具里。
    - generic [ref=f3e185]: ▤ app/main.py
    - generic [ref=f3e186]: "from fastapi import FastAPI, Request from app import service from app.security import Gateway from app.tools import mcp mcp_app = mcp.http_app(path=\"/\") # ① 变成 ASGI 应用 app = FastAPI(lifespan=mcp_app.lifespan) # ② 交托生命周期 app.add_middleware(Gateway) # ③ 网关在最外层 app.mount(\"/mcp\", mcp_app) # ④ 端点 = /mcp/ @app.get(\"/api/tasks\") async def list_tasks(request: Request) -> dict: return {\"user\": request.state.user, \"items\": service.list_tasks(request.state.user)}"
    - paragraph [ref=f3e187]:
      - text: 四行就是全部集成工作。
      - code [ref=f3e188]: request.state.user
      - text: 不用自己赋值 —— 网关放行时已经写进
      - code [ref=f3e189]: scope
      - text: 了。
    - heading "五、网关：鉴权和限流放在一起，一次管两条通道" [level=2] [ref=f3e190]
    - paragraph [ref=f3e191]:
      - text: 为什么不给路由加装饰器？因为
      - code [ref=f3e192]: "@limiter.limit(\"6/minute\")"
      - text: 这类写法只能挂在 FastAPI 的路由函数上，挂不到 mount 进来的 MCP 子应用。要么两套代码，要么下沉一层、在 ASGI 上做一次。
    - generic [ref=f3e193]: ▤ app/security.py
    - generic [ref=f3e194]: "class Gateway: \"\"\"鉴权 -> 限流 -> 放行。顺序不能反。\"\"\" def __init__(self, app): self.app = app async def __call__(self, scope, receive, send): if scope[\"type\"] != \"http\" or scope[\"path\"] in PUBLIC_PATHS: return await self.app(scope, receive, send) user = API_KEYS.get(Headers(scope=scope).get(\"x-api-key\", \"\")) if user is None: return await self._deny(send, 401, \"invalid_api_key\", \"缺少或错误的 x-api-key\") channel = \"/mcp\" if scope[\"path\"].startswith(\"/mcp\") else \"/api\" wait = _take_token(f\"{user}{channel}\", QUOTA[channel], time.monotonic()) if wait > 0: return await self._deny(send, 429, \"rate_limited\", \"请求太频繁\", wait) scope.setdefault(\"state\", {})[\"user\"] = user await self.app(scope, receive, send)"
