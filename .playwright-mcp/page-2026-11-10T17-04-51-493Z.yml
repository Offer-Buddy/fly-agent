    - heading "一、开场：第二套后端是怎么长出来的" [level=2] [ref=e84]
    - paragraph [ref=e85]: 先是给网页写接口，跑得好好的：
    - generic [ref=e86]: "# app/main.py @app.post(\"/api/tasks\") async def create_task(payload: TaskIn, request: Request): return await service.create_task(payload.title, request.state.username)"
    - paragraph [ref=e87]: 现在要让 AI 客户端也能建任务。最省事的写法是新建一个文件，把同一件事再包一遍 —— 只是换了个装饰器：
    - generic [ref=e88]: "# mcp_server.py —— 第二步，问题从这里开始 @mcp.tool async def create_task(title: str) -> dict: return await service.create_task(title, \"alice\") # 谁在问？先写死"
    - paragraph [ref=e89]: 于是三个问题同时冒出来：这个工具知道是谁在调用吗？限流管得到 MCP 吗？AI 建的任务，网页刷新能看见吗？——三个都答不上来，因为同一件业务已经有了两处入口、两套身份。
    - generic [ref=e90]:
      - generic [ref=e91]: 这一课要解决的事
      - text: 不是 MCP 难，是它被当成了第二个后端。它本该是同一个 FastAPI 上多开的一扇门，门后还是那份业务。
    - heading "二、本质：MCP 就是一个子应用" [level=2] [ref=e92]
    - paragraph [ref=e93]:
      - code [ref=e94]: mcp.http_app()
      - text: 返回的不是"另一个框架"，它和 FastAPI 一样是个 ASGI 应用。所以
      - code [ref=e95]: app.mount()
      - text: 能直接把它挂进来，共用一个进程、一份内存、一个端口。
    - generic [ref=e96]:
      - generic [ref=e97]: 三种接法，选一个
      - generic [ref=e98]:
        - generic [ref=e99]: 起两个进程
        - generic [ref=e100]: REST 一个、MCP 一个。数据、连接池、鉴权各一份，部署多一个服务 —— 就是开头那个坑的放大版。
      - generic [ref=e101]:
        - generic [ref=e102]: 自动转换
        - generic [ref=e103]:
          - code [ref=e104]: FastMCP.from_fastapi(app)
          - text: 能把全部路由一次变成工具，连
          - code [ref=e105]: /api/token
          - text: 也会暴露给 AI。工具粒度控制不住，有鉴权的项目别用。
      - generic [ref=e106]:
        - generic [ref=e107]: 挂载子应用
        - generic [ref=e108]: 只把该给 AI 的能力写成工具，其余不暴露。一个进程、一层网关、一份业务 —— 走这条。
    - paragraph [ref=e109]: 集成本身只有四行，网关加在 app 上、mount 也在 app 上，这句话决定了后面所有事：
    - generic [ref=e110]: "mcp_app = mcp.http_app(path=\"/\") # ① MCP 变成 ASGI 子应用 @asynccontextmanager async def lifespan(app): # 原来的预热、收尾都写在这儿，一行不用改 async with mcp_app.lifespan(app): # ② 合并生命周期，不是替换 yield app = FastAPI(lifespan=lifespan) app.add_middleware(Gateway) # ③ 网关在最外层 app.mount(\"/mcp\", mcp_app) # ④ 端点 = /mcp/"
    - paragraph [ref=e111]: 挂载之后，请求在进程里的真实形状是这样：
    - generic [ref=e112]: FastAPI app ├─ Gateway 中间件：先进这里（验 token → 限流） └─ router ├─ /api/* → 普通路由函数 └─ /mcp → MCP 子应用（走到这儿时，网关已经放行过了）
    - paragraph [ref=e113]:
      - text: 所以 mount 进来的东西天生就在网关里面 —— 前提是网关加在
      - code [ref=e114]: app
      - text: 上，而不是加在某个路由上。这就是为什么一个中间件能同时管住人和 AI。
