    - heading "限流：按人算，两条通道分开记" [level=3] [ref=e169]
    - paragraph [ref=e170]:
      - text: 常见做法是 slowapi 的
      - code [ref=e171]: "@limiter.limit(\"30/minute\")"
      - text: 。它在 REST 上很好用，但装饰器只挂得到路由函数，挂不到 mount 进来的子应用 —— MCP 通道等于没限。
    - paragraph [ref=e172]: 既然网关里已经知道是谁了，顺手就在这一层数：每个「用户 + 通道」一个桶，10 秒滑动窗口。
    - generic [ref=e173]: ▤ app/security.py（滑动窗口）
    - generic [ref=e174]: "_hits: dict[str, deque[float]] = defaultdict(deque) def _take(bucket: str, quota: int, now: float) -> float: \"\"\"放行返回 0；被限流返回还要等几秒。\"\"\" q = _hits[bucket] while q and now - q[0] >= WINDOW: # 丢掉滑出窗口的旧记录 q.popleft() if len(q) >= quota: return WINDOW - (now - q[0]) q.append(now) return 0.0 # 网关里，验完票紧接着： channel = \"/mcp\" if scope[\"path\"].startswith(\"/mcp\") else \"/api\" wait = _take(f\"{username}|{channel}\", QUOTA[channel], time.monotonic()) if wait > 0: return await self._deny(send, 429, \"rate_limited\", \"请求太频繁\", wait)"
