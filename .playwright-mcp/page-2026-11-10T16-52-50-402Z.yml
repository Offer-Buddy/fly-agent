    - generic [ref=f1e116]: "# app/api/v1/chatbot.py @router.post(\"/chat\", response_model=ChatResponse) @limiter.limit(settings.RATE_LIMIT_ENDPOINTS[\"chat\"][0]) async def chat(chat_request: ChatRequest, session: Session = Depends(get_current_session)): result = await agent.get_response(chat_request.messages, session.id, user_id=str(session.user_id), username=session.username) return ChatResponse(messages=result)"
    - paragraph [ref=f1e117]: 现在要让 AI 客户端也能问同一个助手。最省事的写法是新建一个文件，把同一件事再包一遍：
    - generic [ref=f1e118]: "# mcp_server.py —— 第二步，问题从这里开始 @mcp.tool def ask(message: str) -> str: result = agent.get_response([{\"role\": \"user\", \"content\": message}], \"demo-thread\", username=\"alice\") # 谁在问？先写死 return result[-1][\"content\"]"
    - paragraph [ref=f1e119]: 于是三个问题同时冒出来：这个工具里到底是谁在提问？限流管得到 MCP 通道吗？AI 说的话，前端刷新能看见吗？——一个都答不上来，因为同一个业务已经有了两处入口、两套身份。
