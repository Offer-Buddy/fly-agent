    - heading "为什么 MCP 的额度必须比 REST 宽" [level=3] [ref=e204]
    - paragraph [ref=e205]:
      - text: 这是最容易翻车的一处：一次工具调用 ≠ 一个 HTTP 请求。客户端握手要
      - code [ref=e206]: initialize
      - text: 、
      - code [ref=e207]: notifications/initialized
      - text: 、
      - code [ref=e208]: tools/list
      - text: ，然后才是
      - code [ref=e209]: tools/call
      - text: ，一次会话眨眼就 5 帧以上。
    - generic [ref=e210]: "QUOTA = {\"/api\": 6, \"/mcp\": 60} # 实测：两条都设 6，MCP 第三次工具调用就 429"
    - generic [ref=e211]:
      - text: 别用调大额度来糊弄。额度放宽只是承认传输层帧数不同；真要按业务量计费，得在工具函数里计数（一次
      - code [ref=e212]: tools/call
      - text: 记一次），而不是在 HTTP 层数请求。
