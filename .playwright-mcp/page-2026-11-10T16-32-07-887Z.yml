    - heading "一、开场：第二套后端是怎么长出来的" [level=2] [ref=e113]
    - paragraph [ref=e114]: 第一步都长这样：先给前端写一套 REST，跑得好好的。
    - generic [ref=e115]: "@app.post(\"/api/tasks\") async def create_task(payload: TaskIn, request: Request): return service.create_task(payload.title, request.state.user)"
    - paragraph [ref=e116]: 第二步，要让 AI 客户端也能建任务。于是新建一个文件，把同一件事再写一遍 —— 只是换了个装饰器：
    - generic [ref=e117]: "@mcp.tool def create_task(title: str) -> dict: return service.create_task(title, \"alice\") # 身份？先写死吧"
    - paragraph [ref=e118]: 现在问三个问题：标题长度校验改在哪一处？限流对 MCP 那套生效了吗？AI 建的任务，前端能看见吗？——三个都答不上来，因为已经有了两份真相。
    - generic [ref=e119]:
      - generic [ref=e120]: 这一课要解决的事
      - text: 不是 MCP 难，是它被当成了第二个后端。它本该是同一个后端上多开的一扇门。
    - heading "二、本质：FastMCP 交出来的就是一个 ASGI 应用" [level=2] [ref=e121]
    - paragraph [ref=e122]:
      - code [ref=e123]: mcp.http_app()
      - text: 返回的不是"另一个框架"，它和 FastAPI 一样是个 ASGI app —— 所以
      - code [ref=e124]: app.mount()
      - text: 能直接把它挂进来，共用一个进程、一份内存、一个端口。
    - generic [ref=e125]:
      - generic [ref=e126]: 三种接法，选一个
      - generic [ref=e127]:
        - generic [ref=e128]: 起两个进程
        - generic [ref=e129]: REST 一个、MCP 一个。状态不共享，鉴权写两遍，部署多一份 —— 就是开场那个坑的放大版。
      - generic [ref=e130]:
        - generic [ref=e131]: 自动转换
        - generic [ref=e132]:
          - code [ref=e133]: FastMCP.from_fastapi(app)
          - text: 能把全部路由一次变成工具。适合原型，但整个 API 都暴露给 AI，工具粒度和描述都控制不住。
      - generic [ref=e134]:
        - generic [ref=e135]: 挂载子应用
        - generic [ref=e136]: 只把该给 AI 的能力写成工具，其余不暴露。一个进程、一层网关、一份业务 —— 这里走这条。
    - paragraph [ref=e137]: 挂载之后，请求在进程里的真实形状是这样，中间件在 router 外面这句话决定了后面所有事：
    - generic [ref=e138]: FastAPI app ├─ Gateway 中间件：先过这里（鉴权 → 限流） └─ router ├─ /api/* ├→ 普通路由函数 └─ /mcp └→ MCP 子应用（路由到这儿时，网关已经放行过了）
    - paragraph [ref=e139]: 所以 mount 进来的东西天然被网关罩住 —— 前提是网关加在 app 上，而不是加在某个路由上。
